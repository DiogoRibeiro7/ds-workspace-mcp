services:
  ds-workspace-mcp:
    build:
      context: .
      dockerfile: Dockerfile
    image: ds-workspace-mcp:local
    env_file:
      - path: .env.example
        required: false
      - path: .env
        required: false
    ports:
      - "${MCP_PORT:-8000}:${MCP_PORT:-8000}"
    environment:
      MCP_TRANSPORT: ${MCP_TRANSPORT:-streamable-http}
      MCP_HOST: 0.0.0.0
      MCP_PORT: ${MCP_PORT:-8000}
      MCP_DATA_ROOT: /app/data
      MCP_MAX_PREVIEW_ROWS: ${MCP_MAX_PREVIEW_ROWS:-50}
      MCP_MAX_SQL_ROWS: ${MCP_MAX_SQL_ROWS:-1000}
      MCP_MAX_CATEGORICAL_VALUES: ${MCP_MAX_CATEGORICAL_VALUES:-5}
      MCP_PROFILE_CACHE_ENABLED: ${MCP_PROFILE_CACHE_ENABLED:-true}
      MCP_PROFILE_CACHE_MAX_ENTRIES: ${MCP_PROFILE_CACHE_MAX_ENTRIES:-128}
      MCP_LOG_LEVEL: ${MCP_LOG_LEVEL:-INFO}
      MCP_API_KEY: ${MCP_API_KEY:-}
      MCP_TRACING_ENABLED: ${MCP_TRACING_ENABLED:-false}
      MCP_TRACING_SERVICE_NAME: ${MCP_TRACING_SERVICE_NAME:-ds-workspace-mcp}
      MCP_TRACING_CONSOLE_EXPORTER: ${MCP_TRACING_CONSOLE_EXPORTER:-false}
    volumes:
      - ./data:/app/data
