name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build Release Artifacts
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Install Poetry
        run: pip install poetry

      - name: Verify release tag matches the package version
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          package_version="$(poetry version -s)"
          if [ "$GITHUB_REF_NAME" != "v$package_version" ]; then
            echo "::error::Tag '$GITHUB_REF_NAME' does not match package version '$package_version'"
            exit 1
          fi

      - name: Install dependencies
        run: poetry install --no-interaction

      - name: Build wheel and source distribution
        run: poetry build

      - name: Upload distribution artifacts
        uses: actions/upload-artifact@v7
        with:
          name: python-package-distributions
          path: dist/

  publish:
    name: Publish to PyPI
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest

    environment:
      name: pypi
      url: https://pypi.org/project/ds-workspace-mcp/

    permissions:
      id-token: write

    steps:
      - name: Download distributions
        uses: actions/download-artifact@v8
        with:
          name: python-package-distributions
          path: dist/

      - name: Publish distributions to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
