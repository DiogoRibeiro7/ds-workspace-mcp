[project]
name = "ds-workspace-mcp"
version = "1.1.0"
description = "A Model Context Protocol server for safely inspecting and profiling local analytical datasets."
readme = "README.md"
license = "MIT"
requires-python = ">=3.11,<3.13"
authors = [
    { name = "Diogo Ribeiro", email = "hansolo.dj@gmail.com" },
]
keywords = ["mcp", "model-context-protocol", "data-science", "analytics", "python"]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Intended Audience :: Developers",
    "Intended Audience :: Science/Research",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering :: Information Analysis",
    "Topic :: Software Development :: Libraries :: Python Modules",
]
dependencies = [
    "mcp[cli]>=1.28.1,<1.29.0",
    "duckdb>=1.5.5,<2.0.0",
    "pandas>=2.2.0,<3.0.0",
    "pydantic>=2.7.0,<3.0.0",
    "pydantic-settings>=2.14.1,<3.0.0",
    "scikit-learn>=1.7.0,<2.0.0",
    "sqlglot (>=30.17.0,<31.0.0)",
    "openpyxl (>=3.1.0,<4.0.0)",
]

[project.optional-dependencies]
opentelemetry = [
    "opentelemetry-api>=1.36.0,<2.0.0",
    "opentelemetry-sdk>=1.36.0,<2.0.0",
]

[project.scripts]
ds-workspace-mcp = "ds_workspace_mcp.cli:main"
generate-sample-healthcare-data = "ds_workspace_mcp.synthetic.healthcare:main"

[project.urls]
"Homepage" = "https://github.com/DiogoRibeiro7/ds-workspace-mcp"
"Repository" = "https://github.com/DiogoRibeiro7/ds-workspace-mcp"
"Documentation" = "https://github.com/DiogoRibeiro7/ds-workspace-mcp#readme"
"Changelog" = "https://github.com/DiogoRibeiro7/ds-workspace-mcp/blob/main/CHANGELOG.md"
"Issue Tracker" = "https://github.com/DiogoRibeiro7/ds-workspace-mcp/issues"
"Security Policy" = "https://github.com/DiogoRibeiro7/ds-workspace-mcp/security/policy"

[tool.poetry]
packages = [{ include = "ds_workspace_mcp", from = "src" }]

[tool.poetry.group.dev.dependencies]
pytest = "^9.1.1"
ruff = "^0.16.1"
mypy = "^1.10.0"
pandas-stubs = "^3.0.5"

[build-system]
requires = ["poetry-core>=1.9.0"]
build-backend = "poetry.core.masonry.api"

[tool.ruff]
line-length = 100
target-version = "py311"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM"]

[tool.mypy]
python_version = "3.11"
strict = true
warn_return_any = true
warn_unused_configs = true
files = ["src", "tests"]

[tool.pytest.ini_options]
markers = [
    "integration: end-to-end tests that exercise real MCP transports",
]
