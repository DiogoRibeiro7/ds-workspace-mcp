[tool.poetry]
name = "ds-workspace-mcp"
version = "1.0.1"
description = "A Model Context Protocol server for safely inspecting and profiling local analytical datasets."
authors = ["Diogo Ribeiro <hansolo.dj@gmail.com>"]
readme = "README.md"
packages = [{ include = "ds_workspace_mcp", from = "src" }]
license = "MIT"
homepage = "https://github.com/DiogoRibeiro7/ds-workspace-mcp"
repository = "https://github.com/DiogoRibeiro7/ds-workspace-mcp"
documentation = "https://github.com/DiogoRibeiro7/ds-workspace-mcp#readme"
keywords = ["mcp", "model-context-protocol", "data-science", "analytics", "python"]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Intended Audience :: Developers",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering :: Information Analysis",
    "Topic :: Software Development :: Libraries :: Python Modules",
]

[tool.poetry.dependencies]
python = ">=3.11,<3.13"
mcp = {extras = ["cli"], version = "^1.9.0"}
duckdb = "^1.4.2"
pandas = "^2.2.0"
pydantic = "^2.7.0"
pydantic-settings = "^2.14.1"
scikit-learn = "^1.7.0"
opentelemetry-api = { version = "^1.36.0", optional = true }
opentelemetry-sdk = { version = "^1.36.0", optional = true }

[tool.poetry.group.dev.dependencies]
pytest = "^9.0.3"
ruff = "^0.5.0"
mypy = "^1.10.0"
pandas-stubs = "^2.2.0"

[tool.poetry.scripts]
ds-workspace-mcp = "ds_workspace_mcp.cli:main"
generate-sample-healthcare-data = "ds_workspace_mcp.synthetic.healthcare:main"

[tool.poetry.extras]
opentelemetry = ["opentelemetry-api", "opentelemetry-sdk"]

[build-system]
requires = ["poetry-core>=1.9.0"]
build-backend = "poetry.core.masonry.api"

[tool.ruff]
line-length = 100
target-version = "py311"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM"]

[tool.mypy]
python_version = "3.11"
strict = true
warn_return_any = true
warn_unused_configs = true
files = ["src", "tests"]

[tool.pytest.ini_options]
markers = [
    "integration: end-to-end tests that exercise real MCP transports",
]
